[project]
name = "cms-api"
version = "0.1.0"
description = "Audio API for the Create: Media Systems (CMS) Minecraft mod: streams any allowed URL as raw PCM via yt-dlp and ffmpeg."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.21",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
